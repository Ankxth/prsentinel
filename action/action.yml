name: PRSentinel
description: Checks every commit and pull request in your public Python repository.
author: Ankxth
branding:
  icon: shield
  color: blue

inputs:
  api-url:
    description: Address of your PRSentinel server (for example https://your-service.onrender.com).
    required: true
  audience:
    description: Identity-token audience. Leave the default unless your server says otherwise.
    required: false
    default: prsentinel
  github-token:
    description: Token used to post the pull request comment.
    required: false
    default: ${{ github.token }}
  fail-on-error:
    description: Fail the workflow when PRSentinel cannot run. Default false, so it never blocks your CI.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Run PRSentinel
      shell: bash
      env:
        PRSENTINEL_API_URL: ${{ inputs.api-url }}
        PRSENTINEL_AUDIENCE: ${{ inputs.audience }}
        PRSENTINEL_GITHUB_TOKEN: ${{ inputs.github-token }}
        PRSENTINEL_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: python3 "$GITHUB_ACTION_PATH/runner/main.py"
