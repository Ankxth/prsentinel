name: PRSentinel
description: Checks every commit and pull request in your public Python repository.
author: Ankxth
branding:
  icon: shield
  color: blue

inputs:
  api-url:
    description: Address of your PRSentinel server (for example https://your-service.onrender.com).
    required: true
  audience:
    description: Identity-token audience. Leave the default unless your server says otherwise.
    required: false
    default: prsentinel
  github-token:
    description: Token used to post the pull request comment.
    required: false
    default: ${{ github.token }}
  fail-on-error:
    description: Fail the workflow when PRSentinel cannot run. Default false, so it never blocks your CI.
    required: false
    default: "false"

  run-tests:
    description: Write and run AI-generated tests for the changed functions. Needs pytest and your project's dependencies installed in an earlier step.
    required: false
    default: "true"

  run-scanners:
    description: Run security scanners (Bandit, pip-audit, detect-secrets) on the old and the new code and report what is new in this commit. They are installed in a throwaway environment, so nothing is needed in an earlier step.
    required: false
    default: "true"

  ai-triage:
    description: Ask the AI for a short opinion (looks real, looks like a false alarm, not sure) on new Bandit findings. It sees about ten lines of code around each finding and never hides one. Needs the AI opt-in on your PRSentinel account.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Run PRSentinel
      shell: bash
      env:
        PRSENTINEL_API_URL: ${{ inputs.api-url }}
        PRSENTINEL_AUDIENCE: ${{ inputs.audience }}
        PRSENTINEL_GITHUB_TOKEN: ${{ inputs.github-token }}
        PRSENTINEL_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        PRSENTINEL_RUN_TESTS: ${{ inputs.run-tests }}
        PRSENTINEL_RUN_SCANNERS: ${{ inputs.run-scanners }}
        PRSENTINEL_AI_TRIAGE: ${{ inputs.ai-triage }}
      run: python3 "$GITHUB_ACTION_PATH/runner/main.py"
