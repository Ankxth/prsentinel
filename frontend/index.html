<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#010409" />
    <title>PRSentinel</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- Dark from the first paint, so there is no white flash while the script loads. -->
    <style>html,body{background:#010409;color:#e6edf3;margin:0}html[data-theme=light],html[data-theme=light] body{background:#f6f8fa;color:#1f2328}</style>
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("prsentinel.theme")==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
